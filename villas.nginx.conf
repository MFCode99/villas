server {
    listen 80;
    server_name villas.mlabcorp.net;

    # Redirecionar HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name villas.mlabcorp.net;

    # SSL - Let's Encrypt (gerado pelo certbot)
    ssl_certificate     /etc/letsencrypt/live/villas.mlabcorp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/villas.mlabcorp.net/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy para o servidor Node.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
